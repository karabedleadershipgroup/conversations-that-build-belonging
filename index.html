const BOUNDARY = `[BOUNDARY - IMPORTANT] This is coaching and learning, not HR, legal, or clinical advice. HARD STOP topics: if the person's question is about, or describes, discrimination, harassment, bullying, retaliation, racism, sexism, or any related conduct (whether they experienced it, witnessed, or are accused of it), you must NOT coach on it, weigh in on it, or offer your read of the situation. This tool and framework are not qualified for those conversations. Respond warmly and briefly, then do three things: (1) tell them to write down what happened, with dates, times, and specifics, while it is fresh; (2) tell them to bring it to their manager or HR right away, and that for anything urgent or unsafe they should go to HR immediately; (3) stop there. Do not analyze the incident, do not suggest what to say to the other person, do not assess whether it "counts," and do not continue the conversation on that topic even if pressed. One short, kind redirect, every time. For anything else that needs HR, a lawyer, or a clinician, say so plainly and warmly and point the person there. Do not improvise legal, HR, or medical direction. Do not invent specific organizational facts, policies, or people; speak to principles and behaviors.`;

/* =====================================================
   TRAINING KNOWLEDGE — shared across AI prompts
   ===================================================== */
const TRAINING = `This is Dr. Isa Karabed's "Conversations That Build Belonging" training for staff, supervisors, and leaders in mission-driven organizations.

CORE IDEA: Culture is not what we say we value. Culture is how we interact when culture is tested. Belonging is created or eroded conversation by conversation.

WHAT IT IS NOT: Not about being overly polite, avoiding hard conversations, walking on eggshells, scripts, or ignoring accountability. It is INTENTIONALITY OVER NICENESS.

CULTURE = THE WAY WE INTERACT. Not policies, titles, or intentions. How we speak to each other, respond under pressure, handle conflict, show respect. Everyone creates culture — every role, every interaction.

WHEN CULTURE IS TESTED: when we are overwhelmed, feel disrespected, expectations are unclear, communication breaks down, we receive feedback we disagree with, we have to hold a boundary with someone we like, decisions are made without us, or it is easier to stay silent.

THE FRAMEWORK: WHY → WHAT → HOW. A mental preparation tool — three quick internal steps before you respond, in order.
- WHY = AWARENESS ("What's driving me right now?"). Identify your emotion before you speak. Purpose: awareness before you speak. Skipping the WHY means the emotion leaks into your tone.
- WHAT = CLARITY ("What needs to be said?"). Identify the need, priority, or expectation in clear, respectful words. Purpose: clarity without blame.
- HOW = DELIVERY ("How do I say it and move forward?"). Tone, pace — calm, rushed, sharp, grounded? Purpose: a delivery that builds trust.
Short version: WHY prepares your mindset. WHAT clarifies your message. HOW shapes your impact.

WORDS THAT BUILD BELONGING:
- Softening + respect: "Please." "Thank you." "I appreciate it." "I hear you." "I understand." "I'm glad you brought this up."
- Boundary + accountability with care: "I'm sorry, I'm unavailable right now." "I want to support, and…" "I need to prioritize…" "Let's find a time…" "Can we revisit this…"
- Collaboration: "Can we…" "Let's…" "How can we…" "Can we prioritize together…"

ASSUMPTION TRAPS TO WATCH: assuming bad intent before checking; assuming silence means agreement; skipping the WHY so the emotion leaks through; mistaking niceness for belonging; mistaking directness for disrespect; reading someone's reaction through your own pressure; assuming "they should know better" — clarity is your job, not theirs.

CLOSING PRINCIPLE: "You don't need perfect words. You need a clear WHAT and a respectful HOW that matches the culture we want."`;

/* =====================================================
   AI PROMPT BUILDERS
   ===================================================== */
function buildCoachPrompt(lang, scenario, userResponse) {
  const langInstruction =
    lang === "es"
      ? "Respond entirely in warm, professional Spanish. Use the framework names in Spanish (POR QUÉ, QUÉ, CÓMO)."
      : "Respond entirely in warm, professional English.";
  return `You are a coaching companion built on Dr. Isa Karabed's "Conversations That Build Belonging" training. Your job is to coach a staff member on how they responded to a real workplace situation. You are supportive, never harsh. There are no perfect answers. ${langInstruction}

${TRAINING}

${BOUNDARY}

THE SITUATION:
${scenario}

THE STAFF MEMBER'S RESPONSE:
"${userResponse}"

Give brief coaching in this exact structure, using these labels:
1. What's working — one or two specific things they did well (be genuine; find something).
2. The framework check — walk their response quickly through WHY (did they name what's driving them?), WHAT (is the message clear and without blame?), and HOW (does the tone and pace build trust?). Name the one step that most needs attention, gently.
3. Try this — one concrete way to strengthen the response, with a sample sentence they could actually say that uses words that build belonging.

Keep it under 160 words total. Be warm and concrete. Do not use markdown headers or bold; just the three numbered points in plain language.`;
}

// ---------- Ask Dr. Isa: portable voice + this training's concepts ----------
function buildIsaPrompt(lang) {
  const langInstruction =
    lang === "es"
      ? "Answer in warm, natural, professional Spanish."
      : "Answer in warm, natural, professional English.";
  return `You are answering AS Dr. Isa Karabed, a warm, direct, faith-grounded leadership coach with deep roots and lived experience in homeless services. Speak as a trusted peer who has been on the floor, not an academic above it. Encouraging and challenging at once. ${langInstruction}

HER VOICE AND MOVES:
- Open warm and simple, then anchor to what the person actually wants.
- Ask before advising; let a question or a brief reflection do the work.
- When someone is frustrated, find the care underneath ("when something gives us that ouch, it's because we care").
- Challenge with permission ("I want to challenge you, and it's for your own benefit"), naming strengths first.
- Separate the what, the why, and the how; drive vague goals into specific behaviors so there's no gray area.
- Honor process over a fragile quick outcome.
- Hold grace and accountability together, never one without the other.
- Hand the work back; don't be the advice monster.
- Plain vivid analogies. Quick specific affirmation. Use "we." Faith and purpose present but never preachy.

WHAT YOU SPEAK ABOUT (stay grounded in THIS training; do not drift into unrelated life advice):
${TRAINING}

Reference the framework by name when it fits ("the WHY step," "the WHAT," "the HOW") but don't always do all three.

HOW TO RESPOND:
KEEP IT SHORT. This is quick guidance, not a coaching session. Most answers are 2 to 4 sentences. Give EITHER one concrete next step OR one thing to reflect on, not both and not a three-part arc. One idea per reply. Warm and direct; a brief question or reflective nudge is welcome ("does that land?" / "want me to give you an example?"). If more would help, end by inviting the next question. Never shame; offer grace and accountability together, but in a line, not a paragraph. Do not use markdown headers or bold.

${BOUNDARY}

For ordinary, everyday situations, stay present and coach with curiosity; never refuse or push the person away.`;
}

// ---------- scenario mode (API-coached) ----------
function ScenarioMode({ t, lang, onBack, bump }) {
  const list = SCENARIOS[lang];
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * list.length));
  const [resp, setResp] = useState("");
  const [feedback, setFeedback] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(false);
  const sc = list[idx];

  async function getCoaching() {
    if (!resp.trim()) return;
    setLoading(true);
    setErr(false);
    setFeedback("");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: buildCoachPrompt(lang, sc.context, resp) }],
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      const text = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n")
        .trim();
      if (!text) throw new Error("empty");
      setFeedback(text);
      bump();
    } catch (e) {
      setErr(true);
    } finally {
      setLoading(false);
    }
  }

  function next() {
    let n = idx;
    while (n === idx && list.length > 1) n = Math.floor(Math.random() * list.length);
    setIdx(n);
    setResp("");
    setFeedback("");
    setErr(false);
  }

  return (
    <div>
      <BackBar t={t} onBack={onBack} label={t.modes.scenario.name} color={C.sage} />
      <div style={{ padding: "26px 30px 34px" }} className="fade" key={idx}>
        <Pill color={C.sage} bg={C.sageSoft}>{sc.tag}</Pill>
        <p
          style={{
            fontSize: 18,
            lineHeight: 1.6,
            color: C.ink,
            margin: "14px 0 22px",
            fontFamily: "'Playfair Display', serif",
          }}
        >
          {sc.context}
        </p>

        <label style={{ fontSize: 13, fontWeight: 600, color: C.navy, letterSpacing: 0.3 }}>
          {t.yourResponse}
        </label>
        <textarea
          value={resp}
          onChange={(e) => setResp(e.target.value)}
          placeholder={t.placeholder}
          rows={4}
          style={{
            width: "100%",
            marginTop: 8,
            padding: "14px 16px",
            borderRadius: 12,
            border: `1px solid ${C.line}`,
            fontSize: 15,
            fontFamily: "'DM Sans', sans-serif",
            resize: "vertical",
            background: C.paper,
            color: C.ink,
            lineHeight: 1.5,
          }}
        />
        <div style={{ fontSize: 12, color: C.muted, marginTop: 7, fontStyle: "italic" }}>
          {t.privacyNote}
        </div>

        <div style={{ display: "flex", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
          <button
            className="gold-btn"
            disabled={loading || !resp.trim()}

// ---------- ask dr. isa mode (API chat) ----------
function AskIsaMode({ t, lang, onBack, bump }) {
  const [history, setHistory] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [history, loading]);

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    const nextHistory = [...history, { role: "user", content: text }];
    setHistory(nextHistory);
    setInput("");
    setLoading(true);
    setErr(false);
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system:
            buildIsaPrompt(lang) +
            "\n\nReply as Dr. Isa, short and in her voice. Do not prefix your reply with a label.",
          messages: nextHistory.slice(-8),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "error");
      const reply = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n")
        .trim();
      if (!reply) throw new Error("empty");
      setHistory([...nextHistory, { role: "assistant", content: reply }]);
      bump();
    } catch (e) {
      setErr(true);
      setHistory(history);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div>
      <BackBar t={t} onBack={onBack} label={t.modes.askisa.name} color={C.gold} />
      <div style={{ padding: "26px 30px 30px" }} className="fade">
        <div
          style={{
            padding: "13px 16px",
            background: C.sageSoft,
            borderRadius: 12,
            fontSize: 13,
            lineHeight: 1.55,
            color: C.ink,
            marginBottom: 20,
            fontStyle: "italic",
          }}
        >
          {t.isaDisclaimer}
        </div>

        <div
          ref={scrollRef}
          style={{
            maxHeight: 420,
            overflowY: "auto",
            display: "flex",
            flexDirection: "column",
            gap: 14,
            marginBottom: 18,
          }}
        >
          <div
            className="rise"
            style={{
              alignSelf: "flex-start",
              maxWidth: "90%",
              padding: "14px 16px",
              background: "#EEF1F6",
              borderRadius: 14,
              borderTopLeftRadius: 4,
            }}
          >
            <Pill color={C.navy}>{t.modes.askisa.name}</Pill>
            <div style={{ fontSize: 15, lineHeight: 1.6, color: C.ink, marginTop: 8 }}>
              {t.isaOpener}
            </div>
          </div>

          {history.map((m, i) =>
            m.role === "user" ? (
              <div
                key={i}
                className="rise"
                style={{
                  alignSelf: "flex-end",
                  maxWidth: "85%",
                  padding: "12px 16px",
                  background: C.navy,
                  color: C.cream,
                  borderRadius: 14,
                  borderTopRightRadius: 4,
                  fontSize: 15,
                  lineHeight: 1.55,
                }}
              >
                {m.content}
              </div>
            ) : (
              <div
                key={i}
                className="rise"
                style={{
                  alignSelf: "flex-start",
                  maxWidth: "90%",
                  padding: "14px 16px",
                  background: "#EEF1F6",
                  borderRadius: 14,
                  borderTopLeftRadius: 4,
                  fontSize: 15,
                  lineHeight: 1.6,
                  color: C.ink,
                  whiteSpace: "pre-wrap",
                }}
              >
                {m.content}
              </div>
            )
          )}

          {loading && (
            <div style={{ alignSelf: "flex-start", color: C.navy, fontSize: 14, animation: "pulse 1.3s infinite", padding: "4px 6px" }}>
              ● ● ●
            </div>
          )}
          {err && (
            <div style={{ alignSelf: "flex-start", padding: "12px 14px", background: C.warnSoft, color: C.warn, borderRadius: 12, fontSize: 14 }}>
              {t.isaError}
            </div>
          )}
        </div>

        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <textarea
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
              }
            }}
            placeholder={t.isaPlaceholder}
            rows={2}
            style={{
              flex: 1,
              padding: "12px 14px",
              borderRadius: 12,
              border: `1px solid ${C.line}`,
              fontSize: 15,
              fontFamily: "'DM Sans', sans-serif",
              resize: "vertical",
              background: C.paper,
              color: C.ink,
              lineHeight: 1.5,
            }}
          />
          <button
            className="gold-btn"
            disabled={loading || !input.trim()}
            onClick={send}
            style={{
              background: C.gold,
              color: C.navy,
              border: "none",
              borderRadius: 100,
              padding: "12px 24px",
              fontSize: 15,
              fontWeight: 700,
              fontFamily: "'DM Sans', sans-serif",
              whiteSpace: "nowrap",
            }}
          >
            {loading ? t.isaThinking : t.isaSend}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- trap mode ----------
function TrapMode({ t, lang, onBack, bump }) {
  const list = TRAPS[lang];
  const [idx, setIdx] = useState(() => Math.floor(Math.random() * list.length));
  const [revealed, setRevealed] = useState(false);
  const [note, setNote] = useState("");
  const tr = list[idx];

  function next() {
    let n = idx;
    while (n === idx && list.length > 1) n = Math.floor(Math.random() * list.length);
    setIdx(n);
    setRevealed(false);
    setNote("");
  }

  return (
    <div>
      <BackBar t={t} onBack={onBack} label={t.modes.trap.name} color={C.warn} />
      <div style={{ padding: "26px 30px 34px" }} className="fade" key={idx}>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>{tr.behavior}</div>
        <div
          style={{
            fontFamily: "'Playfair Display', serif",
            fontStyle: "italic",
            fontSize: 24,
            color: C.warn,
            lineHeight: 1.4,
            padding: "16px 20px",
            background: C.warnSoft,
            borderRadius: 14,
            marginBottom: 22,
          }}
        >
          {tr.reaction}
        </div>

        <label style={{ fontSize: 13, fontWeight: 600, color: C.navy }}>{t.yourTake}</label>
        <textarea
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder={t.trapPlaceholder}
          rows={3}
          style={{
            width: "100%",
            marginTop: 8,
            padding: "14px 16px",
            borderRadius: 12,
            border: `1px solid ${C.line}`,
            fontSize: 15,
            fontFamily: "'DM Sans', sans-serif",
            resize: "vertical",
            background: C.paper,
            color: C.ink,
            lineHeight: 1.5,
          }}
        />

        <div style={{ display: "flex", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
          {!revealed && (
            <button
              className="gold-btn"
              onClick={() => {
                setRevealed(true);
                bump();
              }}
              style={{
                background: C.gold,
                color: C.navy,
                border: "none",
                borderRadius: 100,
                padding: "12px 26px",
                fontSize: 15,
                fontWeight: 700,
                fontFamily: "'DM Sans', sans-serif",
              }}
            >
              {t.showReframe}
            </button>
          )}
          {revealed && (
            <button
              onClick={next}
              className="gold-btn"
              style={{
                background: C.navy,
                color: C.cream,
                border: "none",
                borderRadius: 100,
                padding: "12px 26px",
                fontSize: 15,
                fontWeight: 700,
                fontFamily: "'DM Sans', sans-serif",
              }}
            >
              {t.next}
            </button>
          )}
        </div>

        {revealed && (
          <div
            className="rise"
            style={{
              marginTop: 22,
              padding: "20px 22px",
              background: C.sageSoft,
              borderRadius: 14,
              borderLeft: `4px solid ${C.sage}`,
              fontSize: 15,
              lineHeight: 1.65,
              color: C.ink,
            }}
          >
            {tr.reframe}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- curriculum refresher (slide flip) ----------
function RefresherMode({ t, lang, onBack, onPractice }) {
  const slides = SLIDES[lang];
  const [i, setI] = useState(0);
  const [dir, setDir] = useState(1);
  const total = slides.length;
  const atEnd = i === total - 1;
  const s = slides[i];

  const accentMap = {
    sage: { c: C.sage, bg: C.sageSoft },
    navy: { c: C.navy, bg: "#E3E8F0" },
    gold: { c: C.gold, bg: "#F2EAD0" },
    warn: { c: C.warn, bg: C.warnSoft },
  };
  const ac = accentMap[s.accent] || accentMap.sage;

  function go(n) {
    if (n < 0 || n > total - 1) return;
    setDir(n > i ? 1 : -1);
    setI(n);
  }

  return (
    <div>
      <BackBar t={t} onBack={onBack} label={t.modes.refresher.name} color={C.gold} />

      {/* progress dots */}
      <div
        style={{
          display: "flex",
          gap: 7,
          justifyContent: "center",
          padding: "18px 0 4px",
          flexWrap: "wrap",
        }}
      >
        {slides.map((_, k) => (
          <button
            key={k}
            onClick={() => go(k)}
            aria-label={"slide " + (k + 1)}
            style={{
              width: k === i ? 26 : 9,
              height: 9,
              borderRadius: 100,
              border: "none",
              cursor: "pointer",
              background: k === i ? C.gold : C.line,
              transition: "width .25s ease, background .25s ease",
              padding: 0,
            }}
          />
        ))}
      </div>

      {/* slide */}
      <div style={{ padding: "10px 30px 8px", minHeight: 320 }}>
        <div
          key={i}
          className="rise"
          style={{
            background: C.paper,
            border: `1px solid ${C.line}`,
            borderTop: `5px solid ${ac.c}`,
            borderRadius: 18,
            padding: "30px 30px 34px",
            minHeight: 300,
            display: "flex",
            flexDirection: "column",
            justifyContent: "center",
            boxShadow: "0 10px 30px rgba(27,42,74,.07)",
          }}
        >
          <div style={{ marginBottom: 14 }}>
            <span
              style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 11,
                letterSpacing: 1.6,
                textTransform: "uppercase",
                fontWeight: 700,
                color: ac.c,
                background: ac.bg,
                padding: "6px 13px",
                borderRadius: 100,
              }}
            >
              {s.kicker}
            </span>
          </div>
          <h2
            style={{
              fontFamily: "'Playfair Display', serif",
              fontSize: 30,
              lineHeight: 1.18,
              color: C.navy,
              margin: "0 0 16px",
              fontWeight: 600,
            }}
          >
            {s.title}
          </h2>
          {s.body && (
            <p style={{ fontSize: 17, lineHeight: 1.62, color: C.ink, margin: 0, whiteSpace: "pre-wrap" }}>{s.body}</p>
          )}
          {s.list && (
            <div style={{ display: "grid", gap: 12, marginTop: 4 }}>
              {s.list.map((item, k) => (
                <div key={k} style={{ display: "flex", gap: 13, alignItems: "flex-start" }}>
                  <div
                    style={{
                      width: 26,
                      height: 26,
                      borderRadius: 8,
                      background: ac.bg,
                      color: ac.c,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 14,
                      fontWeight: 700,
                      flexShrink: 0,
                      fontFamily: "'Playfair Display', serif",
                    }}
                  >
                    {k + 1}
                  </div>
                  <div style={{ fontSize: 17, lineHeight: 1.5, color: C.ink, paddingTop: 2 }}>
                    {item}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* controls */}
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "8px 30px 30px",
          gap: 12,
        }}
      >
        <button
          onClick={() => go(i - 1)}
          disabled={i === 0}
          style={{
            background: "none",
            border: `1px solid ${C.line}`,
            color: i === 0 ? C.line : C.muted,
            borderRadius: 100,
            padding: "11px 22px",
            fontSize: 14,
            fontWeight: 600,
            cursor: i === 0 ? "default" : "pointer",
            fontFamily: "'DM Sans', sans-serif",
          }}
        >
          ← {t.prev}
        </button>

        <div style={{ fontSize: 13, color: C.muted, fontFamily: "'DM Sans', sans-serif" }}>
          {i + 1} {t.slideOf} {total}
        </div>

        {!atEnd ? (
          <button
            onClick={() => go(i + 1)}
            className="gold-btn"
            style={{
              background: C.gold,
              color: C.navy,
              border: "none",
              borderRadius: 100,
              padding: "11px 26px",
              fontSize: 15,
              fontWeight: 700,
              fontFamily: "'DM Sans', sans-serif",
            }}
          >
            {t.nextSlide} →
          </button>
        ) : (
          <button
            onClick={onPractice}
            className="gold-btn"
            style={{
              background: C.sage,
              color: C.cream,
              border: "none",
              borderRadius: 100,
              padding: "11px 24px",
              fontSize: 14,
              fontWeight: 700,
              fontFamily: "'DM Sans', sans-serif",
            }}
          >
            {t.goPractice} →
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- concept mode ----------
function ConceptMode({ t, lang, onBack, bump }) {
  const list = CONCEPTS[lang];
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const q = list[idx];
  const answered = picked !== null;

  function pick(i) {
    if (answered) return;
    setPicked(i);
    bump();
  }
  function next() {
    setIdx((idx + 1) % list.length);
    setPicked(null);
  }

  return (
    <div>
      <BackBar t={t} onBack={onBack} label={t.modes.concept.name} color={C.navy} />
      <div style={{ padding: "26px 30px 34px" }} className="fade" key={idx}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>
          {idx + 1} / {list.length}
        </div>
        <p
          style={{
            fontFamily: "'Playfair Display', serif",
            fontSize: 22,
            lineHeight: 1.4,
            color: C.navy,
            margin: "0 0 20px",
            fontWeight: 600,
          }}
        >
          {q.q}
        </p>

        <div style={{ display: "grid", gap: 10 }}>
          {q.options.map((opt, i) => {
            const isAns = i === q.answer;
            const isPicked = i === picked;
            let bg = C.paper,
              border = C.line,
              col = C.ink;
            if (answered) {
              if (isAns) {
                bg = C.sageSoft;
                border = C.sage;
              } else if (isPicked) {
                bg = C.warnSoft;
                border = C.warn;
              }
            }
            return (
              <div
                key={i}
                className="opt"
                tabIndex={0}
                onClick={() => pick(i)}
                style={{
                  background: bg,
                  border: `1.5px solid ${border}`,
                  borderRadius: 12,
                  padding: "14px 16px",
                  fontSize: 15,
                  color: col,
                  lineHeight: 1.45,
                  display: "flex",
                  gap: 12,
                  alignItems: "flex-start",
                  cursor: answered ? "default" : "pointer",
                }}
              >
                <span
                  style={{
                    color: answered && isAns ? C.sage : answered && isPicked ? C.warn : C.muted,
                    fontWeight: 700,
                    flexShrink: 0,
                  }}
                >
                  {answered && isAns ? "✓" : answered && isPicked ? "✕" : String.fromCharCode(65 + i)}
                </span>
                <span>{opt}</span>
              </div>
            );
          })}
        </div>

        {answered && (
          <div
            className="rise"
            style={{
              marginTop: 20,
              padding: "18px 20px",
              background: picked === q.answer ? C.sageSoft : "#EEF1F6",
              borderRadius: 14,
              borderLeft: `4px solid ${picked === q.answer ? C.sage : C.navy}`,
            }}
          >
            <Pill color={picked === q.answer ? C.sage : C.navy}>
              {picked === q.answer ? t.correct : t.review}
            </Pill>
            <div style={{ fontSize: 15, lineHeight: 1.65, color: C.ink, marginTop: 8 }}>{q.why}</div>
            <button
              onClick={next}
              className="gold-btn"
              style={{
                marginTop: 16,
                background: C.gold,
                color: C.navy,
                border: "none",
                borderRadius: 100,
                padding: "11px 24px",
                fontSize: 14,
                fontWeight: 700,
                fontFamily: "'DM Sans', sans-serif",
              }}
            >
              {t.nextQ}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
