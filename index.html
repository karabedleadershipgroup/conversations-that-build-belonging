<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversations That Build Belonging — A Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-2:#2A3B66;
    --gold:#C9A84C;
    --gold-soft:#E0C277;
    --sage:#8AA88E;
    --cream:#FAF8F4;
    --paper:#FFFFFF;
    --ink:#1B2A4A;
    --ink-2:#4B5775;
    --line:#E8E2D6;
    --green:#5B8A6A;
    --yellow:#C9A84C;
    --red:#B5564C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    color:var(--ink);
    background:var(--cream);
    background-image:
      radial-gradient(circle at 12% 10%, rgba(201,168,76,.10), transparent 45%),
      radial-gradient(circle at 88% 90%, rgba(27,42,74,.08), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(138,168,142,.05), transparent 60%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:.025;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /></filter><rect width='100%' height='100%' filter='url(%23n)' /></svg>");
    z-index:0;
  }

  /* Header */
  .header{
    background:var(--navy);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:18px;
    border-bottom:3px solid var(--gold);
    position:relative;
    z-index:5;
  }
  .header .logo{height:44px;width:auto;display:block}
  .header .title-wrap{flex:1;min-width:0}
  .header .eyebrow{
    font-family:'DM Sans';
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:2px;
  }
  .header .title{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:500;
    letter-spacing:.01em;
    line-height:1.1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header .controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .lang-toggle{
    display:flex;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    padding:3px;
    font-size:12px;
    font-weight:600;
  }
  .lang-toggle button{
    background:transparent;
    border:none;
    color:rgba(255,255,255,.65);
    padding:5px 12px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    transition:all .2s;
  }
  .lang-toggle button.active{
    background:var(--gold);
    color:var(--navy);
  }
  .modes-link{
    background:transparent;
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-weight:500;
    font-size:12px;
    transition:all .2s;
    letter-spacing:.02em;
  }
  .modes-link:hover{background:rgba(255,255,255,.08);border-color:var(--gold)}
  .modes-link.hidden{visibility:hidden}

  /* Main container */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
    min-height:0;
  }

  /* Picker screen */
  .picker{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .hero{
    position:relative;
    height:300px;
    overflow:hidden;
    background:var(--navy);
  }
  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(27,42,74,.35) 0%, rgba(27,42,74,.65) 60%, rgba(27,42,74,.95) 100%);
    z-index:1;
  }
  .hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:40px 32px 32px;
    color:#fff;
    z-index:2;
    max-width:880px;
    margin:0 auto;
    width:100%;
  }
  .hero-eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:10px;
  }
  .hero-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:38px;
    line-height:1.1;
    letter-spacing:-.01em;
    margin-bottom:10px;
    max-width:680px;
  }
  .hero-sub{
    font-size:15px;
    line-height:1.5;
    color:rgba(255,255,255,.85);
    max-width:560px;
    font-weight:400;
  }

  .picker-body{
    max-width:880px;
    margin:0 auto;
    width:100%;
    padding:32px 32px 48px;
  }
  .confidentiality{
    background:rgba(255,255,255,.7);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    border-radius:10px;
    padding:16px 20px;
    margin-bottom:28px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink-2);
  }
  .confidentiality strong{color:var(--ink);font-weight:600}

  .picker-header{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:6px;
    letter-spacing:-.005em;
  }
  .picker-sub{
    font-size:14px;
    color:var(--ink-2);
    margin-bottom:22px;
    line-height:1.5;
  }

  /* CASA grouped picker */
  .casa-section{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:24px;
    margin-bottom:28px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .casa-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:8px}
  .casa-letter-col{
    text-align:left;
    padding-top:4px;
  }
  .casa-letter{
    font-family:'Fraunces',serif;
    font-size:68px;
    font-weight:600;
    line-height:.9;
    color:var(--gold);
    letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .casa-section-title{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    line-height:1.2;
    margin-bottom:3px;
  }
  .casa-section-sub{
    font-size:12px;
    color:var(--ink-2);
    line-height:1.35;
  }
  .casa-modes-col{
    display:flex;
    flex-direction:column;
  }

  .mode-card{
    display:flex;
    align-items:flex-start;
    gap:18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.2,.7,.3,1);
    text-align:left;
    width:100%;
    font-family:inherit;
    position:relative;
    box-shadow:0 1px 2px rgba(27,42,74,.03);
  }
  .mode-card:last-child{margin-bottom:0}
  .mode-card:hover{
    transform:translateY(-2px);
    border-color:var(--gold);
    box-shadow:0 8px 20px rgba(27,42,74,.08), 0 2px 4px rgba(27,42,74,.04);
  }
  .mode-card.isa{
    background:linear-gradient(135deg, #FFFBF0 0%, #FFFFFF 100%);
    border-color:var(--gold-soft);
  }
  .mode-text{flex:1;min-width:0}
  .mode-title{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:3px;
    letter-spacing:-.005em;
  }
  .mode-desc{
    font-size:13.5px;
    color:var(--ink-2);
    line-height:1.45;
  }
  .mode-arrow{
    color:var(--ink-2);
    flex-shrink:0;
    opacity:.4;
    transition:all .2s;
    margin-top:14px;
  }
  .mode-card:hover .mode-arrow{opacity:1;color:var(--gold);transform:translateX(3px)}

  /* Chat screen */
  .chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--cream);
  }
  .chat-hero{
    position:relative;
    height:115px;
    flex-shrink:0;
    overflow:hidden;
    background:var(--navy);
  }
  .chat-hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
  }
  .chat-hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(27,42,74,.4) 0%, rgba(27,42,74,.85) 100%);
    z-index:1;
  }
  .chat-hero-content{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 32px;
    color:#fff;
    z-index:2;
    max-width:880px;
    margin:0 auto;
    width:100%;
  }
  .chat-hero-eyebrow{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .chat-hero-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    line-height:1.1;
  }
  .thread{
    flex:1;
    overflow-y:auto;
    padding:24px 32px 16px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:14px;
    max-width:880px;
    margin:0 auto;
    width:100%;
  }
  .msg{
    max-width:78%;
    padding:14px 18px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.55;
    animation:rise .35s cubic-bezier(.2,.7,.3,1);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .msg.assistant{
    background:var(--paper);
    color:var(--ink);
    align-self:flex-start;
    border-radius:18px 18px 18px 5px;
    box-shadow:0 1px 2px rgba(27,42,74,.05), 0 4px 14px rgba(27,42,74,.06);
    border:1px solid var(--line);
    position:relative;
    padding-top:22px;
  }
  .msg.assistant::before{
    content:attr(data-eyebrow);
    position:absolute;
    top:8px;
    left:18px;
    font-size:9px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
  }
  .msg.user{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    align-self:flex-end;
    border-radius:18px 18px 5px 18px;
    box-shadow:0 2px 8px rgba(27,42,74,.18);
  }
  .typing{
    align-self:flex-start;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px 18px 18px 5px;
    padding:14px 18px;
    display:flex;
    gap:5px;
    box-shadow:0 1px 2px rgba(27,42,74,.05);
  }
  .typing span{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--gold);
    opacity:.5;
    animation:dot 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes dot{
    0%,80%,100%{transform:scale(.7);opacity:.4}
    40%{transform:scale(1);opacity:1}
  }
  .composer{
    border-top:1px solid var(--line);
    background:var(--paper);
    padding:14px 32px 18px;
    flex-shrink:0;
  }
  .composer-inner{
    max-width:880px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .composer textarea{
    flex:1;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    resize:none;
    min-height:54px;
    max-height:140px;
    color:var(--ink);
    background:#fdfcfa;
    transition:border-color .2s, box-shadow .2s;
    outline:none;
  }
  .composer textarea:focus{
    border-color:var(--gold);
    background:#fff;
    box-shadow:0 0 0 3px rgba(201,168,76,.12);
  }
  .send-btn{
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    color:var(--navy);
    border:none;
    border-radius:14px;
    padding:0 22px;
    height:54px;
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.04em;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(201,168,76,.3), 0 1px 3px rgba(27,42,74,.1);
    transition:all .2s;
    flex-shrink:0;
  }
  .send-btn:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(201,168,76,.35), 0 2px 4px rgba(27,42,74,.12);
  }
  .send-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .chip{
    background:rgba(255,255,255,.6);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    font-size:12.5px;
    color:var(--ink-2);
    cursor:pointer;
    font-family:inherit;
    transition:all .2s;
  }
  .chip:hover{
    background:#fff;
    border-color:var(--gold);
    color:var(--ink);
    transform:translateY(-1px);
  }

  /* Slide viewer (Curriculum Refresher) */
  .slides{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:var(--cream);
    position:relative;
  }
  .slide{
    max-width:680px;
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:48px 44px;
    box-shadow:0 8px 28px rgba(27,42,74,.07), 0 2px 6px rgba(27,42,74,.04);
    text-align:center;
    animation:rise .4s cubic-bezier(.2,.7,.3,1);
  }
  .slide-eyebrow{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:14px;
  }
  .slide-title{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:500;
    color:var(--ink);
    margin-bottom:22px;
    line-height:1.15;
    letter-spacing:-.01em;
  }
  .slide-body{
    font-size:16px;
    line-height:1.65;
    color:var(--ink-2);
    text-align:left;
    white-space:pre-wrap;
  }
  .slide-body strong{color:var(--ink);font-weight:600}
  .slide-nav{
    margin-top:28px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .slide-nav button{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:9px 20px;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    transition:all .2s;
  }
  .slide-nav button:hover:not(:disabled){
    border-color:var(--gold);
    background:#fff;
    transform:translateY(-1px);
  }
  .slide-nav button.slide-next-quiz{
    background:linear-gradient(135deg, var(--gold), var(--gold-soft));
    border-color:transparent;
    color:var(--navy);
    font-weight:700;
    box-shadow:0 4px 12px rgba(201,168,76,.3);
  }
  .slide-nav button.slide-next-quiz:hover:not(:disabled){
    background:linear-gradient(135deg, var(--gold), var(--gold-soft));
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(201,168,76,.35);
  }
  .slide-nav button:disabled{opacity:.35;cursor:not-allowed}
  .slide-counter{
    font-size:12px;
    color:var(--ink-2);
    letter-spacing:.06em;
    font-weight:600;
    min-width:50px;
    text-align:center;
  }

  /* Flashcard mode (Scenario Practice + Assumption Trap Spotter) */
  .flash{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:24px 32px 40px;
    overflow-y:auto;
  }
  .flash-card{
    max-width:720px;
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:36px 36px 30px;
    box-shadow:0 8px 28px rgba(27,42,74,.07), 0 2px 6px rgba(27,42,74,.04);
    animation:rise .4s cubic-bezier(.2,.7,.3,1);
  }
  .flash-eyebrow{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:12px;
  }
  .flash-scenario{
    font-family:'Fraunces',serif;
    font-size:21px;
    font-weight:500;
    color:var(--ink);
    line-height:1.35;
    margin-bottom:24px;
    letter-spacing:-.005em;
  }
  .flash-prompt{
    font-size:13px;
    color:var(--ink-2);
    margin-bottom:14px;
    font-weight:500;
  }
  .flash-option{
    display:block;
    width:100%;
    background:#fdfcfa;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    line-height:1.45;
    transition:all .2s;
  }
  .flash-option:hover:not(:disabled){
    border-color:var(--gold);
    background:#fff;
    transform:translateY(-1px);
  }
  .flash-option.best{
    background:#EEF5EF;
    border-color:var(--green);
    color:var(--green);
    font-weight:600;
  }
  .flash-option.medium{
    background:#FBF5E4;
    border-color:var(--yellow);
    color:#8A7028;
    font-weight:600;
  }
  .flash-option.least{
    background:#F8EAE8;
    border-color:var(--red);
    color:var(--red);
    font-weight:600;
  }
  .flash-option:disabled{cursor:default}
  .flash-feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    font-size:13.5px;
    line-height:1.5;
    animation:rise .3s cubic-bezier(.2,.7,.3,1);
  }
  .flash-feedback.best{
    background:#EEF5EF;
    border-left:3px solid var(--green);
    color:#3A5A48;
  }
  .flash-feedback.medium{
    background:#FBF5E4;
    border-left:3px solid var(--yellow);
    color:#8A7028;
  }
  .flash-feedback.least{
    background:#F8EAE8;
    border-left:3px solid var(--red);
    color:#7A3530;
  }
  .flash-next{
    margin-top:18px;
    background:linear-gradient(135deg, var(--gold), var(--gold-soft));
    color:var(--navy);
    border:none;
    border-radius:12px;
    padding:12px 22px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:.04em;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(201,168,76,.3);
    transition:all .2s;
  }
  .flash-next:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(201,168,76,.35);
  }
  .flash-loading{
    text-align:center;
    color:var(--ink-2);
    padding:60px 20px;
    font-size:14px;
  }
  .flash-loading .typing{
    display:inline-flex;
    background:transparent;
    border:none;
    box-shadow:none;
    padding:8px 0 0;
  }
  .flash-error{
    text-align:center;
    color:var(--ink-2);
    padding:30px 20px;
  }
  .flash-error button{
    margin-top:12px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
  }

  .hidden{display:none !important}

  @media (max-width:640px){
    .hero{height:240px}
    .hero-title{font-size:28px}
    .picker-body{padding:24px 18px 36px}
    .casa-section{grid-template-columns:1fr;gap:10px;margin-bottom:22px;padding-bottom:22px}

const TRAINING_KNOWLEDGE = `
TRAINING NAME: Conversations That Build Belonging
DEVELOPED BY: Dr. Isa Karabed, DSW
AUDIENCE: Staff, supervisors, and leaders working in mission-driven organizations.

CORE IDEA:
Culture is not what we say we value. Culture is how we interact when culture is tested. This training gives staff a simple, repeatable mental preparation tool to respond in ways that BUILD belonging instead of erode it.

WHAT THIS TRAINING IS:
- A way to operationalize an organization's values in everyday interactions.
- A mental preparation tool for hard moments — not a script, not a personality change.
- Built around the conviction that belonging is created or eroded conversation by conversation.

WHAT THIS TRAINING IS NOT:
- Not about being overly polite or just telling people what they want to hear.
- Not about avoiding difficult conversations — important issues must be addressed directly and honestly.
- Not about walking on eggshells — that hinders authentic communication.
- Not about scripted interactions — genuine conversations require flexibility and authenticity.
- Not about ignoring accountability — we own our actions and their impact.
- It is about INTENTIONALITY OVER NICENESS. Being purposeful in how we communicate.

DEFINITION OF CULTURE:
Culture = The Way We Interact.
Not policies. Not titles. Not intentions.
Culture is how we: speak to each other, respond under pressure, handle conflict, show respect.

WHO CREATES CULTURE:
All of us. Leaders. Staff. Every role. Every interaction.

WHEN CULTURE IS TESTED (the moments the framework is built for):
- When we are overwhelmed
- When we feel disrespected
- When expectations are unclear
- When we are busy or rushed
- When communication breaks down
- When we're asked to do more than we can handle
- When we receive feedback we don't agree with
- When we have to hold a boundary with someone we like
- When we feel our work isn't being recognized
- When decisions are made and we don't feel included
- When we notice something is wrong but it's easier to stay silent
- When we have to choose between speed and doing things the right way

THE FRAMEWORK: WHY → WHAT → HOW
A mental preparation tool. Three quick internal steps before you respond. Walk the steps in order.

STEP 1 — WHY = AWARENESS ("What's driving me right now?")
- Identify your emotion before you speak.
- Ask: What am I feeling right now? Am I overwhelmed, frustrated, rushed, triggered?
- PURPOSE: To create awareness before you speak.
- EXAMPLE INTERNAL THOUGHT: "I'm feeling overwhelmed and under pressure because I have a deadline to meet."

STEP 2 — WHAT = CLARITY ("Thinking about what needs to be said")
- Identify what you will say.
- Ask: What words can I use that are clear and respectful? What need, priority, or expectation do I need to communicate?
- PURPOSE: To bring clarity without blame.
- EXAMPLE INTERNAL FRAME: "I am under pressure to meet a deadline. I will make sure to get back to them."

STEP 3 — HOW = DELIVERY ("How do I say it + move forward")
- Identify how you will say it.
- Ask: What tone will I use? What pace will I use? Am I calm, rushed, sharp, grounded?
- PURPOSE: To ensure your delivery builds trust.
- EXAMPLE OUT-LOUD WORDS: "Thank you for coming to me. Today my time is a bit tight due to an end-of-day deadline. Can I please get back to you tomorrow?"

THE SHORT VERSION:
- WHY prepares your mindset.
- WHAT clarifies your message.
- HOW shapes your impact.

WORDS THAT BUILD BELONGING (small words, big impact):

SOFTENING + RESPECT WORDS:
"Please." "Thank you." "I appreciate it." "I hear you." "I understand." "I see." "I want to support." "I'm glad you brought this up."

BOUNDARY + ACCOUNTABILITY (WITH CARE):
"I'm sorry, I'm unavailable right now." "I want to support, and…" "I need to prioritize…" "Right now, I'm focused on…" "Let's find a time…" "Can we revisit this…"

COLLABORATION WORDS:
"Can we…" "Let's…" "How can we…" "What's the best way…" "Can we prioritize together…"

PRACTICE SCENARIO FROM THE TRAINING:
A policy was recently updated and communicated via email. You notice your coworker is still using the old policy. You remind them. They say "I did not receive that communication" / "There was no update."

A POSSIBLE WALK-THROUGH:
- WHY: "I'm feeling frustrated, but I want us to stay aligned."
- WHAT: "The policy has been updated, and we need to follow the current version."
- HOW (supportive + respectful): "Thank you for letting me know. I understand there may have been a gap in communication, and I appreciate you being open to the update. I can send you what I received so we're aligned moving forward."

CLOSING PRINCIPLE FROM THE TRAINING:
"You don't need perfect words. You need a clear WHAT and a respectful HOW that matches the culture we want."

ASSUMPTIONS AND TRAPS TO WATCH FOR (drawn from the training's intent):
- Assuming bad intent before checking. (E.g., "They're being lazy" / "They're trying to push back.")
- Assuming silence means agreement.
- Skipping the WHY (your own emotion) and going straight to delivering a message — the emotion leaks through.
- Mistaking niceness for belonging. Belonging requires intentional honesty, not avoidance.
- Mistaking directness for disrespect. Holding a boundary with care still builds belonging.
- Reading someone's reaction through your own pressure (rushed = sharp tone you didn't intend).
- Assuming "they should know better" — clarity is your job, not theirs.
- Assuming a coworker is the same as a client — the framework applies to both, but the stakes and language shift.
`;

/* =====================================================
   SIX PRINCIPLES — Layer 3 (operational)
   ===================================================== */
const SIX_PRINCIPLES = `
1. SAFETY. Steady, warm, unhurried. Normalize that hard situations are hard. Never shame or scold. If anyone is in danger, drop curiosity mode and state concern plainly.
2. TRUSTWORTHINESS & TRANSPARENCY. Be clear about what you are doing. If you are about to surface a step of the framework, name it. No hidden agenda. Never pretend to be a human, a therapist, or a supervisor.
3. PEER SUPPORT. Speak as a knowledgeable peer walking alongside, not an authority delivering verdicts. "Many people in this work find..." not "You must..."
4. COLLABORATION & MUTUALITY. Build the response WITH the learner, not at them. Ask what they have already tried or considered. Treat their judgment as real input.
5. EMPOWERMENT, VOICE & CHOICE. Surface the learner's own options and strengths. End turns with a choice or an opening, not an instruction. Never use "you should" as the main verb.
6. CULTURAL, HISTORICAL & GENDER HUMILITY. Stay curious about the learner's context and identity, and the people in their situation. Do not assume what anyone feels, values, or needs based on group identity. Ask rather than presume.

CRISIS OVERRIDE: If a learner mentions imminent risk of harm to themselves or others, abuse, or a mental health crisis — stop curiosity mode immediately. Respond with brief, warm, direct concern. Do not probe for detail. Point toward a trusted person or appropriate resource and make clear you are a practice space, not a crisis service.

STANDING SELF-CHECK before each response: Did I ask before I answered? Did I preserve their choice? Could this shame or pressure them? Am I assuming something I should ask about? If any check fails, revise before sending.
`;

/* =====================================================
   CURIOSITY METHOD — Layer 2
   ===================================================== */
const CURIOSITY_METHOD = `
You teach through questions before answers.
- Open by understanding the situation, not solving it. Ask ONE genuine, open question first.
- Reflect back what you heard before guiding. Name the feeling or the stakes you notice.
- Lead the learner to the framework, do not dump it. Ask the question the framework would ask before naming the step.
- Offer one next move at a time, then check in. Never deliver a numbered plan unless asked.
- Treat the learner as the expert on their own situation. You bring the framework; they bring the truth.
- End turns with an opening, not a verdict.
Curiosity is not a softener on top of advice. It is the structure.
`;

/* =====================================================

   ===================================================== */
function setLang(newLang){
  lang = newLang;
  document.getElementById('langEn').classList.toggle('active', lang==='en');
  document.getElementById('langEs').classList.toggle('active', lang==='es');
  renderShell();
  if (currentMode === null) renderPicker();
  else if (currentMode === 'curriculum') renderSlide();
  else if (currentMode === 'scenario' || currentMode === 'trap') renderFlashShell();
  else renderChatShell();
}

function renderShell(){
  const t = UI[lang];
  document.getElementById('hdrEyebrow').textContent = t.eyebrow;
  document.getElementById('hdrTitle').textContent = t.title;
  document.getElementById('backToModes').textContent = t.backToModes;
  document.getElementById('sendBtn').textContent = t.send;
}

function renderPicker(){
  const t = UI[lang];
  document.getElementById('confidentialityBox').innerHTML = t.confidentiality;
  document.getElementById('pickerHeader').textContent = t.pickerHeader;
  document.getElementById('pickerSub').textContent = t.pickerSub;
  const list = document.getElementById('modesList');
  list.innerHTML = '';
  t.sections.forEach(sec => {
    const section = document.createElement('div');
    section.className = 'casa-section';
    section.innerHTML = `
      <div class="casa-letter-col">
        <div class="casa-letter">${sec.letter}</div>
        <div class="casa-section-title">${escapeHtml(sec.title)}</div>
        <div class="casa-section-sub">${escapeHtml(sec.sub)}</div>
      </div>
      <div class="casa-modes-col"></div>
    `;
    const modesCol = section.querySelector('.casa-modes-col');
    sec.modes.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'mode-card' + (m.key === 'isa' ? ' isa' : '');
      btn.onclick = () => pickMode(m.key);
      btn.innerHTML = `
        <div class="mode-text">
          <div class="mode-title">${escapeHtml(m.title)}</div>
          <div class="mode-desc">${escapeHtml(m.desc)}</div>
        </div>
        <div class="mode-arrow">→</div>
      `;
      modesCol.appendChild(btn);
    });
    list.appendChild(section);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function showScreen(which){
  ['screenPicker','screenChat','screenSlides','screenFlash'].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden', id !== which);
  });
  document.getElementById('backToModes').classList.toggle('hidden', which === 'screenPicker');
}

function goToPicker(){
  currentMode = null;
  showScreen('screenPicker');
  renderPicker();
}

function pickMode(key){
  currentMode = key;
  if (key === 'curriculum'){
    slideIndex = 0;
    showScreen('screenSlides');
    renderSlide();
  } else if (key === 'scenario'){
    flashState = { kind: 'scenario', loading: false, card: null, locked: false };
    showScreen('screenFlash');
    renderFlashShell();
    fetchFlashCard();
  } else if (key === 'trap'){
    flashState = { kind: 'trap', loading: false, card: null, locked: false };
    showScreen('screenFlash');
    renderFlashShell();
    fetchFlashCard();
  } else {
    // chat-based: isa, guidance, concept
    histories[key] = [];
    showScreen('screenChat');
    renderChatShell();
    // seed with opener
    const t = UI[lang];
    const opener = key === 'isa' ? t.openerIsa : key === 'guidance' ? t.openerGuidance : t.openerConcept;
    appendAssistant(opener);
  }
}

function renderChatShell(){
  const t = UI[lang];
  const eyebrowMap = { isa: t.eyebrowIsa, guidance: t.eyebrowGuidance, concept: t.eyebrowConcept };
  const conceptTitle = lang === 'es' ? 'Repaso de Conceptos' : 'Concept Check';
  const titleMap = {
    isa: findModeTitle('isa'),
    guidance: findModeTitle('guidance'),
    concept: conceptTitle
  };
  const placeholderMap = { isa: t.chatPlaceholderIsa, guidance: t.chatPlaceholderGuidance, concept: t.chatPlaceholderConcept };
  document.getElementById('chatEyebrow').textContent = eyebrowMap[currentMode] || '';
  document.getElementById('chatTitle').textContent = titleMap[currentMode] || '';
  document.getElementById('input').placeholder = placeholderMap[currentMode] || '';
  // re-render history
  const thread = document.getElementById('thread');
  thread.innerHTML = '';
  histories[currentMode].forEach(m=>{
    if (m.role === 'user') appendUserDom(m.content);
    else appendAssistantDom(m.content);
  });
}

function appendAssistant(text){
  histories[currentMode].push({ role:'assistant', content: text });
  appendAssistantDom(text);
}

function appendAssistantDom(text){
  const t = UI[lang];
  const eyebrowMap = { isa: t.eyebrowIsa, guidance: t.eyebrowGuidance, concept: t.eyebrowConcept };
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.setAttribute('data-eyebrow', eyebrowMap[currentMode] || '');
  div.textContent = text;
  document.getElementById('thread').appendChild(div);
  scrollThread();
}

function appendUserDom(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  document.getElementById('thread').appendChild(div);
  scrollThread();
}

function scrollThread(){
  const thr = document.getElementById('thread');
  thr.scrollTop = thr.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingDots';
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('thread').appendChild(div);
  scrollThread();
}
function removeTyping(){
  const el = document.getElementById('typingDots');
  if (el) el.remove();
}

async function onSend(){
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  histories[currentMode].push({ role:'user', content: text });
  appendUserDom(text);
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: buildSystemPrompt(currentMode),
        messages: histories[currentMode]
      })
    });
    const data = await res.json();
    removeTyping();
    const reply = (data.content || [])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n").trim();
    if (!reply) throw new Error('empty');
    appendAssistant(reply);
  } catch (err) {
    removeTyping();
    appendAssistantDom(UI[lang].errorGeneric);
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

document.getElementById('input').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    onSend();
  }
});

/* =====================================================
   CURRICULUM REFRESHER (slides)
   ===================================================== */
function findModeTitle(key){
  const t = UI[lang];
  for (const sec of t.sections){
    const m = sec.modes.find(x => x.key === key);
    if (m) return m.title;
  }
  return '';
}

function renderSlide(){
  const t = UI[lang];
  const slides = SLIDES[lang];
  const s = slides[slideIndex];
  const isLast = slideIndex === slides.length - 1;
  document.getElementById('slidesEyebrow').textContent = t.eyebrowSlides;
  document.getElementById('slidesTitle').textContent = findModeTitle('curriculum');
  document.getElementById('slideEyebrow').textContent = `${t.eyebrowSlides}`;
  document.getElementById('slideTitle').textContent = s.title;
  document.getElementById('slideBody').textContent = s.body;
  document.getElementById('slideCounter').textContent = `${slideIndex+1} / ${slides.length}`;
  document.getElementById('slidePrev').disabled = slideIndex === 0;
  document.getElementById('slidePrevLbl').textContent = t.slidePrev;
  // On last slide: turn Next into "Quiz me on this →" and have it switch to Concept Check
  const nextBtn = document.getElementById('slideNext');
  const nextLbl = document.getElementById('slideNextLbl');
  if (isLast){
    nextBtn.disabled = false;
    nextBtn.classList.add('slide-next-quiz');
    nextLbl.textContent = t.quizMeBtn.replace(/\s*→\s*$/, '');
    nextBtn.dataset.action = 'quiz';
  } else {
    nextBtn.disabled = false;
    nextBtn.classList.remove('slide-next-quiz');
    nextLbl.textContent = t.slideNext;
    nextBtn.dataset.action = 'next';
  }
}
function slidePrev(){ if (slideIndex>0){ slideIndex--; renderSlide(); } }
function slideNext(){
  const slides = SLIDES[lang];
  const btn = document.getElementById('slideNext');
  if (btn.dataset.action === 'quiz'){
    // Handoff: switch to Concept Check mode
    pickMode('concept');
    return;
  }
  if (slideIndex < slides.length - 1){ slideIndex++; renderSlide(); }
}
document.addEventListener('keydown', (e)=>{
  if (currentMode !== 'curriculum') return;
  if (e.key === 'ArrowLeft') slidePrev();
  else if (e.key === 'ArrowRight') slideNext();
});

/* =====================================================
   FLASHCARD MODES
   ===================================================== */
function renderFlashShell(){
  const t = UI[lang];
  const isScenario = flashState.kind === 'scenario';
  document.getElementById('flashEyebrow').textContent = isScenario ? t.eyebrowScenario : t.eyebrowTrap;
  document.getElementById('flashTitle').textContent = isScenario
    ? findModeTitle('scenario')
    : findModeTitle('trap');
}

async function fetchFlashCard(){
  const t = UI[lang];
  const isScenario = flashState.kind === 'scenario';
  flashState.loading = true;
  flashState.card = null;
  flashState.locked = false;
  document.getElementById('flashCard').innerHTML = `
    <div class="flash-loading">
      ${t.flashLoading}
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  const moment = isScenario
    ? SCENARIO_MOMENTS[Math.floor(Math.random()*SCENARIO_MOMENTS.length)]
    : TRAP_MOMENTS[Math.floor(Math.random()*TRAP_MOMENTS.length)];

  const userPrompt = isScenario
    ? `Generate ONE scenario flashcard for the Conversations That Build Belonging training.
USE THIS MOMENT (vary your scenarios — do not default to deadlines / interruptions every time): "${moment}"

Write the scenario in 2–3 sentences. Then give THREE possible responses the staff member could give OUT LOUD, ranked by how well they use the WHY-WHAT-HOW framework.
- BEST: clearly demonstrates the framework — internal awareness shows in a calm, grounded tone; the message is clear without blame; the words include softening, boundary-with-care, or collaboration language from the training.
- MEDIUM: well-meaning but skips a step — usually it goes straight to the WHAT without the internal WHY first, OR it has the message but the tone leaks. Still respectful.
- LEAST: skips awareness entirely; reads as defensive, blaming, dismissive, or assumes bad intent. Often something a real person would say in the moment but wouldn't be proud of.

Each option's feedback should be 1–2 sentences in the training's vocabulary, with curiosity and no shame. For best, affirm and name what made it work. For medium and least, name which step was skipped or which trap it fell into.

Respond with ONLY valid JSON, no markdown, no preamble. Schema:
{"scenario":"...","options":[{"text":"...","rank":"best","feedback":"..."},{"text":"...","rank":"medium","feedback":"..."},{"text":"...","rank":"least","feedback":"..."}]}
${lang==='es' ? 'All text in Spanish.' : 'All text in English.'}`
    : `Generate ONE Assumption Trap Spotter flashcard for the Conversations That Build Belonging training.
USE THIS MOMENT: "${moment}"

Show the moment in ONE sentence at most. Then give THREE possible reads of it (~12 words each).
- BEST: catches the snap judgment, names it as an assumption/trap from the training, and reframes with curiosity (e.g., assuming bad intent, mistaking silence for agreement, reading reaction through your own pressure, "they should know better").
- MEDIUM: partly catches it but misses the name of the trap, or skips the reframe.
- LEAST: accepts the snap judgment at face value.

Each option's feedback ~20 words max. Names the trap in the training's vocabulary, with curiosity and no shame.

Respond with ONLY valid JSON, no markdown, no preamble. Schema:
{"scenario":"...","options":[{"text":"...","rank":"best","feedback":"..."},{"text":"...","rank":"medium","feedback":"..."},{"text":"...","rank":"least","feedback":"..."}]}
${lang==='es' ? 'All text in Spanish.' : 'All text in English.'}`;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are generating one flashcard for the "Conversations That Build Belonging" training by Dr. Isa Karabed.

THE TRAINING (use its language):
${TRAINING_KNOWLEDGE}

Respond ONLY with valid JSON, no markdown fences, no preamble.`,
        messages: [{ role:'user', content: userPrompt }]
      })
    });
    const data = await res.json();
    let raw = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    raw = raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    const card = JSON.parse(raw);
    // shuffle option order
    card.options = shuffle(card.options);
    flashState.card = card;
    flashState.loading = false;
    renderFlashCard();
  } catch (err) {
    flashState.loading = false;
    document.getElementById('flashCard').innerHTML = `
      <div class="flash-error">
        ${t.flashError}<br>
        <button onclick="fetchFlashCard()">${t.flashRetry}</button>
      </div>`;
  }
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderFlashCard(){
  const t = UI[lang];
  const isScenario = flashState.kind === 'scenario';
  const card = flashState.card;
  if (!card) return;
  const promptText = isScenario ? t.flashScenarioPrompt : t.flashTrapPrompt;
  let html = `
    <div class="flash-eyebrow">${isScenario ? t.eyebrowScenario : t.eyebrowTrap}</div>
    <div class="flash-scenario">${escapeHtml(card.scenario)}</div>
    <div class="flash-prompt">${escapeHtml(promptText)}</div>
    <div id="flashOptions">`;
  card.options.forEach((opt, idx) => {
    html += `<button class="flash-option" data-idx="${idx}" onclick="onFlashPick(${idx})">${escapeHtml(opt.text)}</button>`;
  });
  html += `</div><div id="flashFeedback"></div>`;
  document.getElementById('flashCard').innerHTML = html;
}

function onFlashPick(idx){
  if (flashState.locked) return;
  const card = flashState.card;
  const opt = card.options[idx];
  const btn = document.querySelector(`.flash-option[data-idx="${idx}"]`);
  btn.classList.add(opt.rank);
  const fb = document.getElementById('flashFeedback');
  fb.innerHTML = `<div class="flash-feedback ${opt.rank}">${escapeHtml(opt.feedback)}</div>`;
  if (opt.rank === 'best'){
    flashState.locked = true;
    document.querySelectorAll('.flash-option').forEach(b => b.disabled = true);
    const t = UI[lang];
    const nextLbl = flashState.kind === 'scenario' ? t.flashNextScenario : t.flashNextTrap;
    const nextBtn = document.createElement('button');
    nextBtn.className = 'flash-next';
    nextBtn.textContent = nextLbl;
    nextBtn.onclick = fetchFlashCard;
    fb.appendChild(nextBtn);
  } else {
    // keep-trying: disable just this option
    btn.disabled = true;
  }
}

/* =====================================================
   INIT
   ===================================================== */
renderShell();
renderPicker();
</script>
